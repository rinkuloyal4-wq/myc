<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B0E14" />
  <title>3T Dial — Admin</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div x-data="Admin" x-init="init()" x-cloak>

  <template x-if="loading">
    <div class="auth-screen"><div class="muted">Loading…</div></div>
  </template>

  <template x-if="!loading && !ok">
    <div class="auth-screen">
      <div class="auth-card center">
        <div class="brand">
          <img src="logo.png" alt="3T Dial" class="brand-logo" onerror="this.style.display='none'" />
          <h1>3T Dial</h1>
          <p class="brand-slogan">Admin Panel</p>
        </div>
        <p class="err" x-text="error || 'You must be signed in as an admin.'"></p>
        <a class="btn primary full" href="/">Go to app</a>
      </div>
    </div>
  </template>

  <template x-if="!loading && ok">
    <div style="max-width:1100px;margin:0 auto;padding:24px 16px 80px">

      <header class="page-head" style="margin-bottom:24px">
        <div class="row">
          <img src="logo.png" alt="" style="width:32px;height:32px;object-fit:contain" onerror="this.style.display='none'" />
          <h1>3T Dial Admin</h1>
        </div>
        <a class="btn ghost small" href="/">Back to app</a>
      </header>

      <h3 class="section-title">Country & number pricing</h3>
      <p class="muted small" style="margin-bottom:12px">
        Set prices per country & type. These are the prices users see when buying numbers and making calls / SMS.
      </p>

      <div class="card" style="overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Country</th>
              <th>Type</th>
              <th>Enabled</th>
              <th>Rental $/mo</th>
              <th>In call $/min</th>
              <th>Out call $/min</th>
              <th>In SMS $</th>
              <th>Out SMS $</th>
              <th>VM $/min</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, idx) in rows" :key="idx">
              <tr>
                <td><input x-model="row.country_code" style="width:70px" /></td>
                <td>
                  <select x-model="row.number_type" style="width:110px">
                    <option value="local">local</option>
                    <option value="toll_free">toll_free</option>
                    <option value="mobile">mobile</option>
                    <option value="national">national</option>
                  </select>
                </td>
                <td><input type="checkbox" x-model="row.enabled" style="width:auto" /></td>
                <td><input type="number" step="0.01" x-model.number="row.rental_usd" style="width:80px" /></td>
                <td><input type="number" step="0.001" x-model.number="row.inbound_call_per_min" style="width:90px" /></td>
                <td><input type="number" step="0.001" x-model.number="row.outbound_call_per_min" style="width:90px" /></td>
                <td><input type="number" step="0.001" x-model.number="row.inbound_sms" style="width:80px" /></td>
                <td><input type="number" step="0.001" x-model.number="row.outbound_sms" style="width:80px" /></td>
                <td><input type="number" step="0.001" x-model.number="row.voicemail_per_min" style="width:80px" /></td>
                <td>
                  <button class="btn ghost small" @click="save(row)" :disabled="busy">Save</button>
                  <button class="btn danger small" @click="remove(row)" :disabled="busy || !row.id">×</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <button class="btn ghost" @click="addRow()">+ Add row</button>

      <h3 class="section-title" style="margin-top:32px">How it works</h3>
      <div class="card">
        <ul style="margin:0;padding-left:20px;line-height:1.8">
          <li><b>Country</b> — 2-letter code (US, GB, CA, AU, IN…)</li>
          <li><b>Type</b> — local, toll_free, mobile, national</li>
          <li><b>Enabled</b> — uncheck to hide this country/type from users</li>
          <li><b>Rental</b> — monthly cost users pay for the number</li>
          <li><b>Call / SMS prices</b> — per minute / per message rates</li>
          <li>Prices here are what <b>users</b> see. Your actual Telnyx cost is separate.</li>
        </ul>
      </div>

      <div class="toast-wrap">
        <template x-for="t in toasts" :key="t.id">
          <div class="toast" :class="t.type" x-text="t.msg"></div>
        </template>
      </div>
    </div>
  </template>

</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script>
window.Admin = {
  loading: true,
  ok: false,
  error: '',
  busy: false,
  rows: [],
  toasts: [],
  _tid: 0,

  async init() {
    try {
      const me = await this.api('/me')
      if (!me.is_admin) {
        this.error = 'Your account is not an admin.'
        this.ok = false
      } else {
        this.ok = true
        await this.load()
      }
    } catch (e) {
      this.error = 'Not signed in.'
    }
    this.loading = false
  },

  async api(path, opts = {}) {
    const res = await fetch('/api' + path, {
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      ...opts,
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.detail || 'Request failed')
    return data
  },

  async load() {
    try {
      const rows = await this.api('/admin/pricing')
      this.rows = rows.map(r => ({ ...r }))
    } catch (e) { this.toast(e.message, 'error') }
  },

  addRow() {
    this.rows.push({
      country_code: '', number_type: 'local', enabled: true,
      rental_usd: 1.5, inbound_call_per_min: 0.01, outbound_call_per_min: 0.015,
      inbound_sms: 0.005, outbound_sms: 0.01, voicemail_per_min: 0.008,
    })
  },

  async save(row) {
    this.busy = true
    try {
      const saved = await this.api('/admin/pricing', {
        method: 'POST',
        body: JSON.stringify(row),
      })
      Object.assign(row, saved)
      this.toast('Saved', 'success')
    } catch (e) { this.toast(e.message, 'error') }
    finally { this.busy = false }
  },

  async remove(row) {
    if (!row.id) {
      this.rows = this.rows.filter(r => r !== row)
      return
    }
    if (!confirm('Delete this pricing row?')) return
    this.busy = true
    try {
      await this.api('/admin/pricing/' + row.id, { method: 'DELETE' })
      this.rows = this.rows.filter(r => r !== row)
      this.toast('Deleted', 'success')
    } catch (e) { this.toast(e.message, 'error') }
    finally { this.busy = false }
  },

  toast(msg, type='info') {
    const id = ++this._tid
    this.toasts.push({ id, msg, type })
    setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id) }, 3000)
  },
}
</script>

<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
